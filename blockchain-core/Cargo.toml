[package]
name = "blockchain-core"
version = "0.1.0"
edition = "2021"
authors = ["KONET Team <dev@konet.io>"]
description = "KONET Blockchain Core - Rust-based blockchain implementation"
license = "MIT"

[dependencies]
# 비동기 런타임
tokio = { version = "1.37", features = ["full"] }

# 웹 프레임워크
actix-web = "4.5"
actix-rt = "2.9"

# 직렬화/역직렬화
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# 암호화
sha2 = "0.10"        # SHA-256 해싱
sha3 = "0.10"        # Keccak-256 (Ethereum 호환)
ed25519-dalek = "2.1"  # 디지털 서명
rand = "0.8"         # 랜덤 생성

# 시간
chrono = { version = "0.4", features = ["serde"] }

# 로깅
log = "0.4"
env_logger = "0.11"

# 에러 처리
anyhow = "1.0"
thiserror = "1.0"

# 데이터베이스
leveldb = "0.8"

# 네트워크
libp2p = { version = "0.53", features = ["tcp", "mdns", "noise", "mplex", "yamux"] }

# 설정 파일
config = "0.14"
toml = "0.8"

# 유틸리티
hex = "0.4"
bs58 = "0.5"  # Base58 인코딩
uuid = { version = "1.8", features = ["v4", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
# 테스트
criterion = "0.5"  # 벤치마크
mockall = "0.12"   # 모킹

[[bin]]
name = "blockchain-node"
path = "src/main.rs"

[[bench]]
name = "blockchain_bench"
harness = false

[profile.release]
opt-level = 3           # 최대 최적화
lto = true              # Link Time Optimization
codegen-units = 1       # 단일 코드 생성 유닛 (더 나은 최적화)
panic = "abort"         # 패닉 시 즉시 종료

[profile.dev]
opt-level = 0           # 최적화 없음 (빠른 컴파일)
